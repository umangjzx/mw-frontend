version: "3.9"

# ══════════════════════════════════════════════════════════════════════════════
# Melody Wings — Full Stack (Safety Detection Integrated)
#
# Usage:
#   docker compose up -d          → Start all services
#   docker compose logs -f        → View logs
#   docker compose down           → Stop all
#   docker compose up -d --build  → Rebuild and start
#
# Access:
#   MW Admin Panel:      http://localhost:3001
#   Safety Dashboard:    http://localhost:3000  (also embedded at /safety)
#   MW Backend API:      http://localhost:8080
#   Safety Backend API:  http://localhost:8000
# ══════════════════════════════════════════════════════════════════════════════

x-dns: &dns
  dns:
    - 8.8.8.8
    - 1.1.1.1

services:

  # ── Redis (task broker + cache) ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: mw-redis
    restart: unless-stopped
    <<: *dns
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Safety Detection Backend ────────────────────────────────────────────────
  safety-backend:
    build:
      context: ./New-Rmsi-Latest/backend
      dockerfile: Dockerfile
    container_name: mw-safety-backend
    restart: unless-stopped
    <<: *dns
    ports:
      - "8000:8000"
    env_file:
      - ./New-Rmsi-Latest/backend/.env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - USE_CELERY=true
      - MW_BACKEND_URL=http://mw-backend:8080
    volumes:
      - safety_uploads:/app/uploads
      - safety_reports:/app/reports
      - safety_logs:/app/logs
      - model_cache:/root/.cache/huggingface
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '4'
        reservations:
          memory: 1G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 90s

  # ── Safety Celery Worker (background ML analysis) ───────────────────────────
  safety-worker:
    build:
      context: ./New-Rmsi-Latest/backend
      dockerfile: Dockerfile
    container_name: mw-safety-worker
    restart: unless-stopped
    <<: *dns
    command: celery -A celery_app:celery_app worker --loglevel=info --pool=threads --concurrency=4
    env_file:
      - ./New-Rmsi-Latest/backend/.env
    environment:
      - PYTHONPATH=/app
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - USE_CELERY=true
      - MW_BACKEND_URL=http://mw-backend:8080
    volumes:
      - safety_uploads:/app/uploads
      - safety_reports:/app/reports
      - safety_logs:/app/logs
      - model_cache:/root/.cache/huggingface
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '4'
        reservations:
          memory: 1G
    depends_on:
      redis:
        condition: service_healthy
  # ── Safety Frontend (Next.js dashboard) ─────────────────────────────────────
  safety-frontend:
    build:
      context: ./New-Rmsi-Latest/admin-next
      dockerfile: Dockerfile
    container_name: mw-safety-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - BACKEND_URL=http://safety-backend:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000/ws/progress
    depends_on:
      safety-backend:
        condition: service_healthy

  # ── MW Backend (existing app + safety integration) ──────────────────────────
  mw-backend:
    build:
      context: ./melody-wings-backend
      dockerfile: Dockerfile
    container_name: mw-backend
    restart: unless-stopped
    <<: *dns
    ports:
      - "8080:8080"
    env_file:
      - ./melody-wings-backend/.env
    environment:
      - SAFETY_SERVICE_URL=http://safety-backend:8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  redis_data:
  safety_uploads:
  safety_reports:
  safety_logs:
  model_cache:
